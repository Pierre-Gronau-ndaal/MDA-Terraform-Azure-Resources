name: MDA Infra Deployment

trigger:
  none

pr:
  branches:
    include:
    - main

variables:
  tfVersion: '1.0.0'
  backendResourceGroup: 'rg-terraform-state'
  backendStorageAccount: 'stterraformstate'
  backendContainerName: 'tfstate'

stages:
  - stage: Plan
    displayName: Plan Stage
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: TerraformPlan
        displayName: Terraform Plan
        pool:
          name: 'MDA DevOps Terraform Runners'
        steps:
          - checkout: git://MDA_Terraform_Repo@main
            persistCredentials: true

          - task: TerraformInstaller@0
            displayName: 'Install Terraform $(tfVersion)'
            inputs:
              terraformVersion: $(tfVersion)

          - script: |
              set -e
              echo "Initializing Terraform"
              terraform init \
                -backend-config="resource_group_name=$(backendResourceGroup)" \
                -backend-config="storage_account_name=$(backendStorageAccount)" \
                -backend-config="container_name=$(backendContainerName)" \
                -backend-config="key=$(Build.Environment).tfstate"
              terraform fmt -check
              terraform validate
              terraform plan -var-file=$(Build.Environment).tfvars -detailed-exitcode
            displayName: 'Run Terraform Plan'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

  - stage: Deploy
    displayName: Deploy Stage
    condition: succeeded()
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        displayName: Terraform Apply
        environment: prod-deploy
        pool:
          name: 'MDA DevOps Terraform Runners'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: git://MDA_Terraform_Repo@main
                
                - task: TerraformInstaller@0
                  displayName: 'Install Terraform $(tfVersion)'
                  inputs:
                    terraformVersion: $(tfVersion)

                - script: |
                    set -e
                    printf "Validating Terraform configuration\n"
                    terraform init \
                      -backend-config="resource_group_name=$(backendResourceGroup)" \
                      -backend-config="storage_account_name=$(backendStorageAccount)" \
                      -backend-config="container_name=$(backendContainerName)" \
                      -backend-config="key=$(Build.Environment).tfstate"
                    terraform apply -var-file=$(Build.Environment).tfvars -auto-approve
                  displayName: 'Run Terraform Apply'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
